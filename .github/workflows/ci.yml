name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Ruff lint
        run: |
          source .venv/bin/activate
          ruff check src/ tests/

      - name: Ruff format check
        run: |
          source .venv/bin/activate
          ruff format --check src/ tests/

      - name: Type check
        run: |
          source .venv/bin/activate
          mypy src/docx_comments

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # system_author.py has real macOS/Windows code paths; run the
          # suite where they actually execute (oldest supported + newest).
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.14"
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run tests
        run: |
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          pytest --cov=docx_comments --cov-report=xml --cov-fail-under=80

  # Exercise the declared dependency floor (python-docx>=1.0.0) so a commit
  # cannot silently start requiring a newer python-docx API.
  test-dependency-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies at the floor
        run: |
          uv venv
          uv pip install -e ".[dev]" "python-docx==1.0.0" "lxml==4.9.4"

      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest

  ci-passed:
    name: CI Passed
    needs: [lint, test, test-dependency-floor]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "Lint job failed"
            exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Test job failed"
            exit 1
          fi
          if [ "${{ needs.test-dependency-floor.result }}" != "success" ]; then
            echo "Dependency-floor job failed"
            exit 1
          fi
          echo "All checks passed!"
